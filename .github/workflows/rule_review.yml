name: 신호 규칙 월간 점검

on:
  schedule:
    # 매달 1일 한국 시간 09:10 = UTC 00:10
    - cron: "10 0 1 * *"
  workflow_dispatch: {}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy yfinance supabase
      - name: 후보 규칙 평가 · 확실히 나을 때만 제안 기록
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python jobs/rule_review.py
